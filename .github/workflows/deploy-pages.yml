name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to the gh-pages branch, which GitHub Pages serves.
# Runs on every push to main, after each daily market-data fetch (so new sessions go
# live), and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Fetch market data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: Deploy ${{ github.sha }}
